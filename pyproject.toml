[project]
name = "code-review-comment-generation"
version = "0.1.0"
description = "Comparing FMFT/PEFT/ICL adaptation strategies for automated code-review comment generation"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Optional editable install (pip install -e .); scripts also run directly as
# `python -m src.<module>` from the repo root without installing.
[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]
addopts = "-q"
